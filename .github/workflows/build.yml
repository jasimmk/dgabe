name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full release helper fixtures on publishing and Apple hosts
        if: runner.os != 'Windows'
        run: npm test
      - name: Version and semantic-release fixtures on Windows
        if: runner.os == 'Windows'
        run: node --test tools/release/orchestration.test.mjs tools/release/version.test.mjs tools/release/package-desktop.test.mjs tools/release/ios-metadata.test.mjs tools/release/icon-assets.test.mjs tools/release/verify-pe-icon.test.mjs
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Linux SDL3 dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev xvfb xauth
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy with the default vendored SDL3 configuration
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build native release
        run: cargo build --locked --release
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Verify native Windows executable icon resources and original artwork
        if: runner.os == 'Windows'
        run: node tools/release/verify-pe-icon.mjs target/release/dangerous-gabe.exe assets/icons/app.ico
      - name: Exercise the Linux window icon on a real X11 backend
        if: runner.os == 'Linux'
        env:
          SDL_VIDEO_DRIVER: x11
          SDL_AUDIO_DRIVER: dummy
        run: xvfb-run -a node --input-type=module -e 'import {spawnSync} from "node:child_process"; const result=spawnSync("./target/release/dangerous-gabe",["--scene","title","--frames","3"],{encoding:"utf8",timeout:15000}); if(result.error) throw result.error; if(result.status!==0 || result.stderr.includes("Window icon unavailable:")) throw new Error(result.stderr || "X11 window icon smoke failed"); console.log(result.stdout);'
      - name: Input, simulation and twelve-stage campaign tests
        run: cargo test --locked --lib --test app_icon --test simulation --test campaign_routes
      - name: Bounded SDL CLI tests
        if: runner.os == 'Linux'
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_AUDIO_DRIVER: dummy
        run: cargo test --locked --test cli
  macos-release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: macos-explicit-release-11
      - name: Build the exact macOS release target
        run: cargo build --locked --release --target aarch64-apple-darwin
      - name: Package and verify the actual archived app
        shell: bash
        run: |
          gabe_version="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; import {packageVersion} from "./tools/release/version.mjs"; console.log(packageVersion(readFileSync("Cargo.toml", "utf8")));')"
          gabe_name="dangerous-gabe-$gabe_version-aarch64-apple-darwin"
          node tools/release/package-desktop.mjs --target aarch64-apple-darwin --version "$gabe_version" --binary target/aarch64-apple-darwin/release/dangerous-gabe --output dist
          unzip -t "dist/$gabe_name.zip"
          ditto -x -k "dist/$gabe_name.zip" "$RUNNER_TEMP/gabe-macos-verify"
          codesign --verify --deep --strict "$RUNNER_TEMP/gabe-macos-verify/$gabe_name/Dangerous Gabe.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$RUNNER_TEMP/gabe-macos-verify/$gabe_name/Dangerous Gabe.app/Contents/Info.plist")" = app.icns
          cmp assets/icons/app.icns "$RUNNER_TEMP/gabe-macos-verify/$gabe_name/Dangerous Gabe.app/Contents/Resources/app.icns"
          node --input-type=module -e 'import {execFileSync} from "node:child_process"; const binary=process.argv[1]; const load=execFileSync("otool",["-l",binary],{encoding:"utf8"}); if(!/\bminos 11\.0\b/.test(load)) throw new Error("Expected macOS 11.0 deployment floor"); const unresolved=execFileSync("nm",["-u",binary],{encoding:"utf8"}); if(unresolved.includes("___isPlatformVersionAtLeast")) throw new Error("Unresolved Objective-C availability runtime");' target/aarch64-apple-darwin/release/dangerous-gabe
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2.9.2
      - run: bash platform/ios-build.sh simulator
      - run: bash platform/ios-build.sh device
