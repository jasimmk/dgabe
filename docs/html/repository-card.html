<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=1280">
  <meta name="robots" content="noindex">
  <title>Dangerous Gabe repository card</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    html,body{margin:0;width:1280px;height:640px;overflow:hidden}
    body{position:relative;background:#07111f;color:#f2edd6;font-family:system-ui,-apple-system,sans-serif;background-image:radial-gradient(ellipse at 78% 42%,rgba(67,135,125,.3),transparent 65%),repeating-linear-gradient(100deg,transparent 0 170px,rgba(189,123,87,.06) 171px 172px,transparent 173px 340px)}
    .rule{position:absolute;left:88px;right:88px;top:80px;height:1px;background:rgba(189,123,87,.4)}
    .copy{position:absolute;left:88px;top:112px;width:400px;z-index:1}
    .eyebrow{font:12px/1.5 ui-monospace,SFMono-Regular,monospace;letter-spacing:.1em;color:#72e0da;margin:0 0 28px}
    .logo{display:block;width:380px;height:auto;image-rendering:pixelated}
    .tagline{font-size:44px;font-weight:600;line-height:1.1;letter-spacing:-.04em;margin:28px 0 24px}
    .details{font:13px/1.6 ui-monospace,SFMono-Regular,monospace;color:#c5ef8a;margin:0;letter-spacing:.02em}
    .frame{position:absolute;right:88px;top:112px;width:620px;background:#101b32;border:1px solid #bd7b57;box-shadow:12px 12px 0 rgba(43,102,112,.2),0 24px 64px rgba(0,0,0,.3)}
    .game{display:block;width:100%;height:auto;image-rendering:pixelated}
    .caption{position:absolute;right:88px;top:540px;color:#b6c4c7;font:11px/1.5 ui-monospace,SFMono-Regular,monospace;letter-spacing:.08em;margin:0}
  </style>
</head>
<body>
  <div class="rule" aria-hidden="true"></div>
  <div class="copy">
    <p class="eyebrow">AN ORIGINAL STORM-GARDEN ADVENTURE</p>
    <img class="logo" src="assets/wordmark.svg" width="380" height="136" alt="Dangerous Gabe">
    <p class="tagline">The storm has<br>a gardener.</p>
    <p class="details">12 ORIGINAL LEVELS · RUST + SDL3<br>ONE LIVING SKY.</p>
  </div>
  <div class="frame"><img class="game" src="assets/new-stage-12.png" width="1920" height="1280" alt="Gabe in the Dawnseed Crown greenhouse, an actual native game frame"></div>
  <p class="caption">DAWNSEED CROWN / ACTUAL GAME CAPTURE</p>
</body>
</html>
